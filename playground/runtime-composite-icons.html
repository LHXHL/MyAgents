<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyAgents · Runtime 图标与面板设计实验</title>
<style>
:root{color-scheme:light;--page:#f3f1ee;--paper:#fffefa;--elevated:#fff;--inset:#f5f3ef;--ink:#35332f;--muted:#8b857c;--line:#e7e2db;--accent:#ad5c40;--selected:#f7ece5;--shadow:0 18px 42px #40322316,0 2px 5px #40322308;--cut:#fff;--focus:#b56b4d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark;--page:#252421;--paper:#2d2b27;--elevated:#34312c;--inset:#3b3731;--ink:#eee9e0;--muted:#ada69b;--line:#47423b;--accent:#e9a17e;--selected:#4b372b;--shadow:0 18px 42px #0003,0 2px 5px #0002;--cut:#34312c;--focus:#e9a17e}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--focus);outline-offset:4px}button:disabled{cursor:default}h1,h2,h3,p{margin:0}main{max-width:1340px;padding:40px 36px 48px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--muted);margin-bottom:9px;font-weight:600}h1{font-size:28px;font-weight:600;letter-spacing:-.04em}.intro{font-size:14px;line-height:1.8;color:var(--muted);margin-top:10px}.toolbar{display:flex;gap:8px;flex-shrink:0}.toolbar button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:12px}.toolbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}h2{font-size:18px;font-weight:600;letter-spacing:-.02em}.section-head p{font-size:12px;color:var(--muted)}.number{font-size:12px;color:var(--muted);margin-right:8px}.icon-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:38px}.concept{--cut:var(--elevated);position:relative;display:block;width:100%;text-align:left;padding:20px 22px 17px;border:1px solid var(--line);border-radius:16px;background:var(--elevated);transition:border-color .15s,box-shadow .15s}.concept:hover{border-color:var(--muted)}.concept[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.concept-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.concept-title{font-size:14px;font-weight:600}.choice-dot{width:17px;height:17px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:transparent;font-size:11px}.concept[aria-pressed="true"] .choice-dot{background:var(--accent);border-color:var(--accent);color:var(--elevated)}.concept-caption{font-size:12px;line-height:1.6;color:var(--muted);margin-top:5px;min-height:20px}.large-icons{display:flex;gap:54px;align-items:center;justify-content:center;padding:24px 0 20px}.logo-example{display:flex;flex-direction:column;align-items:center;gap:10px}.logo-label{font-size:11px;color:var(--muted)}.real-sizes{display:flex;justify-content:center;align-items:center;gap:20px;border-top:1px solid var(--line);padding-top:13px}.size-example{display:flex;align-items:center;gap:8px}.size-label{font-size:11px;color:var(--muted)}
/* Two independent rounded tiles; the foreground edge uses the local surface color. */
.combo{position:relative;display:inline-block;flex-shrink:0;width:calc(var(--s)*1.42);height:var(--s);vertical-align:middle;--s:20px;--tile:calc(var(--s)*.82);--edge:calc(var(--s)*.055)}.tile{position:absolute;display:grid;place-items:center;width:var(--tile);height:var(--tile);border-radius:calc(var(--tile)*.23);overflow:hidden;isolation:isolate}.tile img{display:block;width:100%;height:100%;object-fit:contain}.tile.ma{background:#212121;left:0;top:calc(var(--s)*.09)}.tile.engine{background:#e9e9e7;left:calc(var(--s)*.6);top:calc(var(--s)*.09);z-index:2;box-shadow:0 0 0 var(--edge) var(--cut)}.tile.claude{background:#e9704b}.tile.dsh img{width:96%;height:96%}.combo.horizontal{--tile:var(--s)}.combo.horizontal .tile{top:0}.combo.horizontal .engine{left:calc(var(--s)*.58)}.combo.horizontal{width:calc(var(--s)*1.58)}.combo.diagonal{width:calc(var(--s)*1.16);--tile:calc(var(--s)*.76)}.combo.diagonal .ma{top:0}.combo.diagonal .engine{left:calc(var(--s)*.4);top:calc(var(--s)*.24)}.combo.badge{width:calc(var(--s)*1.22);height:var(--s);--tile:calc(var(--s)*.93)}.combo.badge .ma{top:0}.combo.badge .engine{width:calc(var(--s)*.6);height:calc(var(--s)*.6);left:calc(var(--s)*.62);top:calc(var(--s)*.4);border-radius:calc(var(--s)*.14);--edge:calc(var(--s)*.065)}.combo.reverse{width:calc(var(--s)*1.36);--tile:calc(var(--s)*.86)}.combo.reverse .engine{left:calc(var(--s)*.5);top:0;z-index:1;box-shadow:none}.combo.reverse .ma{top:calc(var(--s)*.14);z-index:2;box-shadow:0 0 0 var(--edge) var(--cut)}.combo.seam{width:calc(var(--s)*1.74);--tile:var(--s)}.combo.seam .tile{top:0}.combo.seam .ma{transform:rotate(-5deg)}.combo.seam .engine{left:calc(var(--s)*.74);transform:rotate(5deg);box-shadow:0 0 0 var(--edge) var(--cut)}.combo.stack{width:calc(var(--s)*1.26);--tile:calc(var(--s)*.88)}.combo.stack .ma{top:0;transform:rotate(-9deg)}.combo.stack .engine{top:calc(var(--s)*.12);left:calc(var(--s)*.38);transform:rotate(6deg);box-shadow:0 0 0 var(--edge) var(--cut),0 calc(var(--s)*.035) calc(var(--s)*.1) #0002}.solo{display:block;width:var(--s,24px);height:var(--s,24px);object-fit:contain;border-radius:22%;flex-shrink:0}
.panel-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.panel-demo{min-width:0}.panel-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.panel-heading h3{font-size:14px;font-weight:600}.panel-heading span{font-size:11px;color:var(--muted)}.stage{position:relative;padding:24px 16px 20px;background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:454px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:26px;overflow:hidden}.stage::before{content:"MyAgents";position:absolute;font-size:54px;letter-spacing:-.05em;top:1px;right:-10px;opacity:.035;pointer-events:none;font-weight:600}.menu{position:relative;width:100%;background:var(--elevated);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:15px;padding:8px 0;--cut:var(--elevated)}.menu-head{display:flex;justify-content:space-between;align-items:center;padding:5px 14px 10px;gap:8px}.menu-title{font-size:12px;font-weight:600;color:var(--muted)}.settings{display:flex;align-items:center;gap:4px;font-size:11px;border:0;background:none;padding:3px 4px;color:var(--muted);border-radius:4px}.settings:hover{background:var(--inset)}svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.group-heading{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;padding:8px 14px 6px;font-weight:500}.group-heading svg{width:12px;height:12px;opacity:.7}.menu-row{--cut:var(--elevated);display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;width:100%;text-align:left;min-height:47px;transition:background .12s}.menu-row:hover{background:var(--inset);--cut:var(--inset)}.menu-row.selected{background:var(--selected);--cut:var(--selected)}.icon-slot{width:36px;flex:0 0 36px;display:flex;justify-content:flex-start;align-items:center}.row-text{min-width:0;flex:1}.row-name{display:block;font-size:14px;font-weight:500;white-space:nowrap;letter-spacing:-.02em}.menu-row.selected .row-name{color:var(--accent)}.row-sub{display:none;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}.tick{width:14px;visibility:hidden;color:var(--accent)}.menu-row.selected .tick{visibility:visible}.separator{height:1px;background:var(--line);margin:8px 14px}.trigger-wrap{display:flex;align-items:center;gap:12px;width:100%;color:var(--muted);font-size:11px}.trigger{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--elevated);padding:9px 11px;--cut:var(--elevated);box-shadow:0 2px 5px #00000005}.trigger svg{width:12px;height:12px}.panel-note{font-size:12px;line-height:1.8;color:var(--muted);margin:12px 2px 0;min-height:44px}.menu-footer{display:none}.menu.polished{padding:12px 8px 8px;border-radius:17px}.polished .menu-head{padding:0 6px 9px}.polished .group-heading{padding:8px 6px 8px}.polished .menu-row{border-radius:9px;padding:11px 8px;min-height:64px;gap:10px}.polished .row-sub{display:block}.polished .icon-slot{width:50px;flex-basis:50px}.polished .separator{margin:9px 6px}.polished .row-name{font-size:14px}.polished .menu-title{color:var(--ink);font-size:13px}.menu.minimal{padding:12px 8px;border-radius:13px;box-shadow:0 12px 28px #0000000f}.minimal .menu-head{padding:0 6px 8px}.minimal .group-heading{padding:9px 6px 7px}.minimal .menu-row{border-radius:6px;padding:11px 8px;gap:8px}.minimal .icon-slot{width:33px;flex-basis:33px}.minimal .separator{margin:10px 6px}.minimal .menu-footer{display:flex;align-items:center;gap:5px;border-top:1px solid var(--line);padding:11px 6px 0;margin-top:9px;font-size:11px;color:var(--muted)}.minimal .menu-row.selected{background:var(--inset);--cut:var(--inset)}.footnote{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;line-height:1.8;color:var(--muted)}.current{color:var(--accent);font-weight:500}.recommend{font-size:10px;border-radius:4px;padding:2px 5px;color:var(--accent);background:var(--selected);margin-left:5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);border:1px solid var(--line);border-radius:12px;background:var(--elevated);box-shadow:var(--shadow);padding:12px 20px;font-size:13px;z-index:5}.toast[hidden]{display:none}
@media(min-width:1150px){.panel-grid{gap:20px}.stage{padding:24px 14px 20px}}
@media(max-width:1090px){main{padding:28px 20px}.panel-grid{grid-template-columns:1fr 1fr}.panel-demo:last-child{grid-column:1/-1;max-width:430px;justify-self:center;width:100%}.row-name{font-size:13px}.icon-grid{gap:10px}.concept{padding:18px 14px}.large-icons{gap:30px}.real-sizes{gap:12px}.section-head{align-items:flex-start}}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column;gap:16px}.icon-grid{grid-template-columns:1fr 1fr}.panel-grid{grid-template-columns:1fr}.panel-demo:last-child{grid-column:auto;max-width:none}.stage{max-width:420px;margin:auto}.large-icons{gap:24px}.large-icons .combo{--s:42px!important}.real-sizes{gap:8px}.size-example{gap:4px}.size-label{font-size:9px}.section-head{flex-direction:column;gap:6px}.footnote{align-items:flex-start;flex-direction:column}h1{font-size:24px}.concept-caption{min-height:38px}.concept-title{font-size:12px}.recommend{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header class="top">
<div><p class="eyebrow">MYAGENTS / DESIGN EXPLORATION</p><h1>两个品牌，一个运行时。</h1><p class="intro">圆角方块叠合，让 MyAgents 与底层引擎都有自己的位置。<br>点击图标方案，下方 3 个面板同步预览；点击运行时可体验选中状态。</p></div>
<div class="toolbar" aria-label="外观"><button type="button" data-theme="light" aria-pressed="true">浅色</button><button type="button" data-theme="dark" aria-pressed="false">深色</button></div>
</header>
<section aria-labelledby="iconsHeading"><div class="section-head"><h2 id="iconsHeading"><span class="number">01</span>组合图标</h2><p>大图看结构 · 16 / 20 / 28 px 看实际辨识度</p></div><div class="icon-grid" id="iconGrid"></div></section>
<section aria-labelledby="panelsHeading"><div class="section-head"><h2 id="panelsHeading"><span class="number">02</span>运行环境面板</h2><p id="selectionNote" class="current" aria-live="polite"></p></div><div class="panel-grid" id="panelGrid"></div></section>
<footer class="footnote"><span>Claude 使用现有品牌图标；DSH 使用清理后的原始鲸鱼素材。<br>此页用于设计选择，所有状态切换仅在此页生效。</span><span>已选搭配：<strong class="current">E 轻倾双卡 × ① 精修紧凑</strong></span></footer>
</main>
<div class="toast" id="toast" hidden role="status"></div>
<script>
const assets='../src/renderer/assets/runtime-icons/';
const variants=[
 {id:'A',cls:'horizontal',name:'水平叠合',caption:'等大方块，前景描边隔开品牌。'},
 {id:'B',cls:'diagonal',name:'斜向叠合',caption:'左上 MyAgents，右下引擎。紧凑、均衡。'},
 {id:'C',cls:'badge',name:'引擎角标',caption:'MyAgents 为主体，引擎作为右下角标。'},
 {id:'D',cls:'reverse',name:'MyAgents 在前',caption:'引擎作底，MyAgents 覆于左下。'},
 {id:'E',cls:'seam',name:'轻倾双卡',caption:'两张方卡轻微展开，保留更多标志。'},
 {id:'F',cls:'stack',name:'错落堆叠',caption:'叠卡加轻阴影，更有层次与动感。'}
];
const runtimeOptions=[
 {id:'builtin',name:'MyAgents (Claude Agent SDK)',engine:'claude',sub:'Claude Agent SDK'},
 {id:'dsh',name:'MyAgents (DeepSeek Harness)',engine:'dsh',sub:'DeepSeek Harness'},
 {id:'claude-code',name:'Claude Code CLI',asset:'claude-code.png',sub:''},
 {id:'codex',name:'Codex CLI',asset:'codex.png',sub:''}
];
const panels=[
 {id:'compact',title:'① 精修紧凑',tag:'保留现有密度',note:'弱化分组标题，选中项铺浅色背景。保持熟悉的菜单节奏。'},
 {id:'polished',title:'② 清晰分层',tag:'推荐',note:'内缩的圆角选中项与一行说明，让集成引擎和外部 CLI 更易区分。'},
 {id:'minimal',title:'③ 极简原生',tag:'轻量 · 克制',note:'更轻的阴影、中性选中背景，仅用名称与勾选突出当前项。'}
];
let variant='E',runtime='dsh';
const gear='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 2 3-1 1-3 3-1 2-3-2-2 1-3-2-3-3 1-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>';
const check='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>';
const info='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></svg>';
const chevron='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>';
function combo(engine,cls,size){return `<span class="combo ${cls}" style="--s:${size}px" aria-hidden="true"><span class="tile ma"><img src="${assets}myagents.png" alt="" draggable="false"></span><span class="tile engine ${engine}"><img src="${assets}${engine==='claude'?'claude-code.png':'deepseek-harness.png'}" alt="" draggable="false"></span></span>`;}
function icon(option,size){return option.engine?combo(option.engine,variants.find(v=>v.id===variant).cls,size):`<img class="solo" style="--s:${size}px" src="${assets}${option.asset}" alt="" draggable="false">`;}
function renderCards(){document.getElementById('iconGrid').innerHTML=variants.map(v=>`<button type="button" class="concept" data-variant="${v.id}" aria-pressed="${v.id===variant}"><span class="concept-head"><span class="concept-title">${v.id} · ${v.name}${v.id==='E'?'<span class="recommend">已选</span>':''}</span><span class="choice-dot" aria-hidden="true">✓</span></span><span class="concept-caption" style="display:block">${v.caption}</span><span class="large-icons"><span class="logo-example">${combo('claude',v.cls,48)}<span class="logo-label">MyAgents × Claude</span></span><span class="logo-example">${combo('dsh',v.cls,48)}<span class="logo-label">MyAgents × DSH</span></span></span><span class="real-sizes">${[16,20,28].map(s=>`<span class="size-example">${combo('dsh',v.cls,s)}<span class="size-label">${s}</span></span>`).join('')}</span></button>`).join('');}
function row(option,panel){const selected=option.id===runtime;return `<button type="button" class="menu-row ${selected?'selected':''}" data-runtime="${option.id}" aria-pressed="${selected}"><span class="icon-slot">${icon(option,panel==='polished'?28:20)}</span><span class="row-text"><span class="row-name">${panel==='polished'&&option.engine?`MyAgents × ${option.engine==='claude'?'Claude':'DSH'}`:option.name}</span>${option.sub?`<span class="row-sub">${option.sub}</span>`:''}</span><span class="tick" aria-hidden="true">${check}</span></button>`;}
function renderPanels(){const selected=runtimeOptions.find(o=>o.id===runtime);document.getElementById('selectionNote').textContent=`当前图标：${variant} · ${variants.find(v=>v.id===variant).name}`;document.getElementById('panelGrid').innerHTML=panels.map(p=>`<article class="panel-demo"><div class="panel-heading"><h3>${p.title}</h3><span>${p.tag}</span></div><div class="stage"><div class="menu ${p.id}"><div class="menu-head"><span class="menu-title">运行环境</span><button type="button" class="settings" data-settings="true">${gear} 设置</button></div><div class="group-heading">集成运行时 ${info}</div>${runtimeOptions.slice(0,2).map(o=>row(o,p.id)).join('')}<div class="separator"></div><div class="group-heading">外部 CLI ${info}</div>${runtimeOptions.slice(2).map(o=>row(o,p.id)).join('')}<div class="menu-footer">${info} 为新对话选择运行环境</div></div><div class="trigger-wrap"><button type="button" class="trigger" title="当前运行环境：${selected.name}" aria-label="当前运行环境：${selected.name}">${icon(selected,16)}${chevron}</button><span>输入框入口 · 16 px</span></div></div><p class="panel-note">${p.note}</p></article>`).join('');}
document.getElementById('iconGrid').addEventListener('click',e=>{const button=e.target.closest('[data-variant]');if(!button)return;variant=button.dataset.variant;for(const card of document.querySelectorAll('[data-variant]'))card.setAttribute('aria-pressed',String(card.dataset.variant===variant));renderPanels();});
let toastTimer;
document.getElementById('panelGrid').addEventListener('click',e=>{const button=e.target.closest('[data-runtime]');if(button){runtime=button.dataset.runtime;renderPanels();return;}if(e.target.closest('[data-settings],.trigger')){const toast=document.getElementById('toast');toast.textContent='设计预览：可点击上方运行时选项体验切换';toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2300);}});
document.querySelectorAll('.toolbar button').forEach(button=>button.addEventListener('click',()=>{document.documentElement.dataset.theme=button.dataset.theme;document.querySelectorAll('.toolbar button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
renderCards();renderPanels();
</script>
</body>
</html>
