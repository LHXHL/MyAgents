<!doctype html>
<!-- Non-production design playground. Production UI does not import this file. -->
<html lang="zh-CN" data-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyAgents Permission Mode Icon Playground</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf6ee;
      --paper-elevated: #fffcf7;
      --paper-inset: #e8dccf;
      --ink: #1c1612;
      --ink-secondary: #2e2825;
      --ink-muted: #6f6156;
      --ink-subtle: #a69a90;
      --accent: #c26d3a;
      --accent-hover: #e18a58;
      --accent-soft: rgb(194 109 58 / 0.08);
      --line: rgb(28 22 18 / 0.10);
      --line-strong: rgb(28 22 18 / 0.18);
      --line-subtle: rgb(28 22 18 / 0.06);
      --hover-bg: rgb(194 109 58 / 0.07);
      --shadow-md: 0 8px 24px rgb(28 22 18 / 0.12);
      --shadow-lg: 0 20px 52px rgb(28 22 18 / 0.16);
      --font-ui: 'SF Pro Text', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Microsoft YaHei UI', sans-serif;
    }

    html[data-scheme='dark'] {
      color-scheme: dark;
      --paper: #1e1b19;
      --paper-elevated: #282421;
      --paper-inset: #36302c;
      --ink: #f0e8e0;
      --ink-secondary: #e2d8d0;
      --ink-muted: #b9aaa0;
      --ink-subtle: #847970;
      --accent: #d27b47;
      --accent-hover: #e18a58;
      --accent-soft: rgb(210 123 71 / 0.11);
      --line: rgb(240 232 224 / 0.11);
      --line-strong: rgb(240 232 224 / 0.19);
      --line-subtle: rgb(240 232 224 / 0.07);
      --hover-bg: rgb(210 123 71 / 0.12);
      --shadow-md: 0 8px 24px rgb(0 0 0 / 0.26);
      --shadow-lg: 0 20px 52px rgb(0 0 0 / 0.34);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 920px; height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: #eceeed;
      background: #111313;
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }

    button { border: 0; font: inherit; }
    svg { display: block; }

    .lab {
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
      width: 100%;
      height: 100dvh;
    }

    .lab-toolbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid rgb(255 255 255 / 0.08);
      background: #181a1a;
    }

    .lab-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 275px;
      color: #f3f4f2;
      font-size: 13px;
      font-weight: 650;
    }

    .lab-mark {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border: 1px solid rgb(255 255 255 / 0.13);
      border-radius: 8px;
      color: #ead6bd;
      background: #262929;
      font-size: 12px;
      font-weight: 750;
    }

    .lab-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #858b89;
      font-size: 12px;
    }

    .lab-status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #78a08c;
      box-shadow: 0 0 0 3px rgb(120 160 140 / 0.10);
    }

    .theme-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      margin-left: auto;
      padding: 0 11px;
      border: 1px solid rgb(255 255 255 / 0.10);
      border-radius: 9px;
      color: #c3c7c5;
      background: #222525;
      font-size: 12px;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .theme-button:hover { color: #f1f2f1; background: #2a2d2d; }
    .theme-button:active { transform: scale(0.98); }
    .theme-button svg { width: 14px; height: 14px; }

    .lab-body {
      display: grid;
      grid-template-columns: 274px minmax(560px, 1fr) 292px;
      min-height: 0;
    }

    .candidate-panel,
    .inspector {
      min-height: 0;
      overflow-y: auto;
      background: #171919;
    }

    .candidate-panel {
      padding: 24px 14px;
      border-right: 1px solid rgb(255 255 255 / 0.07);
    }

    .eyebrow {
      margin: 0 10px 13px;
      color: #707674;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .candidate-list { display: grid; gap: 4px; }

    .candidate-button {
      position: relative;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 58px;
      padding: 8px 10px;
      border-radius: 11px;
      color: #969c99;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .candidate-button:hover { color: #dfe1df; background: rgb(255 255 255 / 0.04); }
    .candidate-button:active { transform: scale(0.985); }
    .candidate-button[aria-selected='true'] { color: #f1f2f1; background: rgb(194 109 58 / 0.14); }

    .candidate-button[aria-selected='true']::before {
      content: '';
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 0;
      width: 2px;
      border-radius: 9999px;
      background: #c87949;
    }

    .candidate-index {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border: 1px solid rgb(255 255 255 / 0.10);
      border-radius: 8px;
      color: #737977;
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 11px;
    }

    .candidate-button[aria-selected='true'] .candidate-index {
      border-color: rgb(200 121 73 / 0.36);
      color: #e0ae8d;
      background: rgb(200 121 73 / 0.08);
    }

    .candidate-copy { min-width: 0; }
    .candidate-name { display: block; font-size: 13px; font-weight: 620; line-height: 1.35; }
    .candidate-note { display: block; margin-top: 3px; color: #686e6c; font-size: 11px; line-height: 1.35; }
    .candidate-button[aria-selected='true'] .candidate-note { color: #9da29f; }

    .candidate-trio { display: flex; align-items: center; gap: 4px; color: #707674; }
    .candidate-trio svg { width: 13px; height: 13px; stroke-width: 1.75; }
    .candidate-button[aria-selected='true'] .candidate-trio { color: #c88962; }

    .scope-note {
      margin: 22px 10px 0;
      padding-top: 16px;
      border-top: 1px solid rgb(255 255 255 / 0.07);
      color: #676d6b;
      font-size: 11px;
      line-height: 1.65;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 28px;
      background:
        radial-gradient(840px 540px at 70% 0%, rgb(195 148 116 / 0.09), transparent 62%),
        #101212;
    }

    .stage-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      width: min(100%, 780px);
      margin: 0 auto 16px;
    }

    .stage-kicker { margin: 0 0 5px; color: #c47b4d; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .stage-title { margin: 0; color: #f0f1ef; font-size: 20px; font-weight: 650; letter-spacing: -0.015em; }
    .stage-note { max-width: 345px; margin: 0; color: #777d7b; font-size: 12px; line-height: 1.55; text-align: right; }

    .app-frame {
      position: relative;
      width: min(100%, 780px);
      height: 630px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 0.09);
      border-radius: 19px;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 28px 80px rgb(0 0 0 / 0.36);
      transition: color 200ms ease, background 200ms ease;
    }

    .app-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 48px;
      padding: 0 15px;
      border-bottom: 1px solid var(--line);
    }

    .window-controls { display: flex; gap: 7px; }
    .window-dot { width: 10px; height: 10px; border: 1px solid var(--line-strong); border-radius: 9999px; background: var(--paper-inset); }
    .chat-title { color: var(--ink-secondary); font-size: 12px; font-weight: 620; }

    .more-button {
      justify-self: end;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 9px;
      color: var(--ink-muted);
      background: transparent;
    }

    .more-button svg { width: 16px; height: 16px; }

    .chat-empty {
      position: absolute;
      inset: 48px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 88px;
      color: var(--ink-subtle);
    }

    .brand-word { color: var(--ink); font-size: 46px; font-weight: 280; letter-spacing: -0.04em; opacity: 0.9; }
    .brand-subtitle { margin-top: 8px; color: var(--ink-muted); font-size: 14px; }

    .mode-menu {
      position: absolute;
      right: 25px;
      bottom: 91px;
      left: 25px;
      width: min(calc(100% - 50px), 572px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: color-mix(in srgb, var(--paper-elevated) 95%, transparent);
      box-shadow: var(--shadow-lg), inset 0 1px rgb(255 255 255 / 0.08);
      backdrop-filter: blur(18px);
      transform-origin: bottom center;
      animation: pop 240ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(7px) scale(0.987); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .menu-head {
      display: flex;
      align-items: center;
      height: 60px;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
      color: var(--ink-muted);
      font-size: 16px;
      font-weight: 570;
    }

    .mode-row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 112px;
      padding: 15px 24px;
      color: var(--ink);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .mode-row:hover { background: var(--hover-bg); }
    .mode-row:active { transform: scale(0.99); }
    .mode-row.is-selected { background: var(--accent-soft); }

    .mode-row-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      color: var(--ink-muted);
    }

    .mode-row.is-selected .mode-row-icon { color: var(--accent); }
    .mode-row-icon svg { width: 26px; height: 26px; stroke-width: 1.7; }
    .mode-label { display: block; color: var(--ink); font-size: 20px; font-weight: 650; line-height: 1.35; }
    .mode-row.is-selected .mode-label { color: var(--accent); }
    .mode-description { display: block; margin-top: 7px; color: var(--ink-muted); font-size: 16px; line-height: 1.45; }

    .composer {
      position: absolute;
      right: 25px;
      bottom: 20px;
      left: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(calc(100% - 50px), 572px);
      min-height: 64px;
      margin: 0 auto;
      padding: 8px 12px;
      border: 1px solid var(--line-subtle);
      border-radius: 20px;
      background: var(--paper-elevated);
      box-shadow: var(--shadow-md);
    }

    .plus-button,
    .tool-button,
    .mode-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 12px;
      border-radius: 14px;
      color: var(--ink-muted);
      background: transparent;
      font-size: 16px;
      font-weight: 550;
    }

    .plus-button { width: 42px; justify-content: center; padding: 0; }
    .mode-trigger { color: var(--ink); background: var(--hover-bg); }
    .plus-button svg, .tool-button svg, .mode-trigger svg { width: 20px; height: 20px; stroke-width: 1.7; }
    .mode-trigger .chevron { width: 14px; height: 14px; }

    .inspector {
      padding: 24px 22px;
      border-left: 1px solid rgb(255 255 255 / 0.07);
    }

    .recommendation {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 13px;
      padding: 4px 8px;
      border: 1px solid rgb(200 121 73 / 0.26);
      border-radius: 9999px;
      color: #dfa47f;
      background: rgb(200 121 73 / 0.10);
      font-size: 11px;
      font-weight: 650;
    }

    .recommendation::before { content: ''; width: 5px; height: 5px; border-radius: 9999px; background: currentColor; }
    .inspector-title { margin: 0; color: #f0f1ef; font-size: 18px; font-weight: 650; }
    .inspector-summary { margin: 9px 0 0; color: #909593; font-size: 12px; line-height: 1.65; }

    .inspector-section { margin-top: 24px; padding-top: 19px; border-top: 1px solid rgb(255 255 255 / 0.07); }
    .inspector-label { margin: 0 0 11px; color: #707674; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .icon-specs { display: grid; gap: 10px; }

    .icon-spec {
      display: grid;
      grid-template-columns: 30px 58px 1fr;
      align-items: center;
      gap: 8px;
      color: #818785;
      font-size: 12px;
    }

    .icon-spec-glyph {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid rgb(255 255 255 / 0.08);
      border-radius: 9px;
      color: #c18864;
      background: rgb(255 255 255 / 0.025);
    }

    .icon-spec-glyph svg { width: 17px; height: 17px; stroke-width: 1.75; }
    .icon-spec strong { color: #e2e4e2; font-weight: 620; }
    .icon-spec code { color: #717775; font-family: ui-monospace, 'SF Mono', monospace; font-size: 11px; }

    .judgement {
      padding: 12px 13px;
      border-left: 2px solid #b66d42;
      border-radius: 0 8px 8px 0;
      color: #afb3b1;
      background: rgb(255 255 255 / 0.025);
      font-size: 12px;
      line-height: 1.65;
    }

    .fixed-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .fixed-list li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; color: #878d8a; font-size: 12px; line-height: 1.55; }
    .fixed-list svg { width: 13px; height: 13px; margin-top: 2px; color: #799886; stroke-width: 2; }
    .keyboard-hint { margin-top: 21px; color: #5f6563; font-size: 11px; line-height: 1.55; }

    @media (max-width: 1180px) {
      .lab-body { grid-template-columns: 256px minmax(560px, 1fr); }
      .inspector { display: none; }
      .stage-note { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <div class="lab">
    <header class="lab-toolbar">
      <div class="lab-brand"><span class="lab-mark">MA</span><span>权限模式 Icon Playground</span></div>
      <div class="lab-status">只比较图标，样式与文案固定</div>
      <button class="theme-button" id="themeButton" type="button" aria-label="切换明暗外观"></button>
    </header>

    <main class="lab-body">
      <nav class="candidate-panel" aria-label="图标候选">
        <p class="eyebrow">五组候选</p>
        <div class="candidate-list" id="candidateList" role="tablist" aria-orientation="vertical"></div>
        <p class="scope-note">固定不变：菜单宽高、选中态、排列顺序、模式名称、描述文案，以及输入框触发器样式。</p>
      </nav>

      <section class="stage">
        <div class="stage-head">
          <div>
            <p class="stage-kicker" id="stageKicker"></p>
            <h1 class="stage-title" id="stageTitle"></h1>
          </div>
          <p class="stage-note">点击左侧候选只会替换三个图标；点击菜单项可以检查不同选中态。</p>
        </div>

        <div class="app-frame">
          <header class="app-header">
            <div class="window-controls" aria-hidden="true"><span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span></div>
            <div class="chat-title">mino · 新对话</div>
            <button class="more-button" type="button" aria-label="更多选项" data-static-icon="more"></button>
          </header>

          <div class="chat-empty">
            <div class="brand-word">MyAgents</div>
            <div class="brand-subtitle">今天，想干点啥？</div>
          </div>

          <div class="mode-menu" id="modeMenu" role="menu" aria-label="会话模式"></div>

          <div class="composer">
            <button class="plus-button" type="button" aria-label="添加上下文" data-static-icon="plus"></button>
            <button class="mode-trigger" id="modeTrigger" type="button" aria-haspopup="menu" aria-expanded="true"></button>
            <button class="tool-button" type="button"><span data-inline-icon="wrench"></span><span>工具 2</span></button>
          </div>
        </div>
      </section>

      <aside class="inspector">
        <p class="eyebrow" style="margin-left:0">图标说明</p>
        <div id="recommendation"></div>
        <h2 class="inspector-title" id="inspectorTitle"></h2>
        <p class="inspector-summary" id="inspectorSummary"></p>

        <section class="inspector-section">
          <p class="inspector-label">Lucide 对应</p>
          <div class="icon-specs" id="iconSpecs"></div>
        </section>

        <section class="inspector-section">
          <p class="inspector-label">我的判断</p>
          <div class="judgement" id="judgement"></div>
        </section>

        <section class="inspector-section">
          <p class="inspector-label">所有候选共同保持</p>
          <ul class="fixed-list">
            <li><span data-inline-icon="check"></span><span>统一 1.75 stroke 的 24px 线性图标。</span></li>
            <li><span data-inline-icon="check"></span><span>图标继承文字色，选中时同步使用 Accent。</span></li>
            <li><span data-inline-icon="check"></span><span>不新增底色、Badge 或额外权限提示。</span></li>
          </ul>
        </section>
        <p class="keyboard-hint">键盘：按 1–5 切换候选，按 L 切换明暗预览。</p>
      </aside>
    </main>
  </div>

  <script>
    const paths = {
      zap: '<path d="M13 2 5 14h7l-1 8 8-12h-7l1-8Z"/>',
      clipboardList: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/>',

      chevronUp: '<path d="m6 15 6-6 6 6"/>',
      more: '<circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/>',
      moon: '<path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/>',
      sun: '<circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    };

    function icon(name, className = '') {
      return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
    }

    const modes = [
      { id: 'auto', label: '行动', description: 'Agent 在工作区内行动，使用工具需确认' },
      { id: 'plan', label: '规划', description: '规划模式，只读不执行' },
      { id: 'full', label: '自主行动', description: 'Agent 拥有完全自主权限，无需人工确认' }
    ];

    const candidates = [
      {
        name: '原语义线性化',
        note: '保留当前三个隐喻',
        recommended: false,
        summary: '把当前图形原样换成同一套线性 Icon，认知成本最低。',
        judgement: '最符合“只换 Icon”的边界。三个图形与现有含义一一对应，用户不需要重新学习；同时解决 emoji 在 macOS / Windows 上体积和颜色不一致的问题。',
        icons: [
          { name: 'zap', component: 'Zap' },
          { name: 'clipboardList', component: 'ClipboardList' },
          { name: 'rocket', component: 'Rocket' }
        ]
      },
      {
        name: '权限边界',
        note: '强调是否受控',
        recommended: true,
        summary: '把图标从“动作类型”切换为“权限边界”。',
        judgement: '权限含义最清楚，尤其是“自主行动”的解锁符号很直接；但行动和规划的视觉语义与当前版本变化较大。',
        icons: [
          { name: 'shieldCheck', component: 'ShieldCheck' },
          { name: 'eye', component: 'Eye' },
          { name: 'unlock', component: 'LockOpen' }
        ]
      },
      {
        name: '执行节奏',
        note: '开始、路线、快进',
        recommended: false,
        summary: '用推进速度区分三种 Agent 工作状态。',
        judgement: '三枚图标的造型关系最统一，输入框里非常利落；不过“规划”夹在播放与快进之间，语义需要看文案才能完全理解。',
        icons: [
          { name: 'play', component: 'Play' },
          { name: 'route', component: 'Route' },
          { name: 'fastForward', component: 'FastForward' }
        ]
      },
      {
        name: 'Agent 工作态',
        note: '执行、研究、自驱',
        recommended: false,
        summary: '图标直接描绘 Agent 当下在做什么。',
        judgement: '对非技术用户友好，工作含义具体；Bot 图标容易被理解成“聊天机器人入口”，和产品里的 Bot 概念存在轻微冲突。',
        icons: [
          { name: 'hammer', component: 'Hammer' },
          { name: 'fileSearch', component: 'FileSearch' },
          { name: 'bot', component: 'Bot' }
        ]
      },
      {
        name: '抽象动作',
        note: '点击、构思、持续',
        recommended: false,
        summary: '更克制、抽象，弱化工具感，强调工作方式。',
        judgement: '视觉上最轻，也最有设计感；但 Infinity 对“自主行动”的表达不如 Rocket 或 LockOpen 直观，属于审美优先方案。',
        icons: [
          { name: 'mousePointerClick', component: 'MousePointerClick' },
          { name: 'draftingCompass', component: 'DraftingCompass' },
          { name: 'infinity', component: 'Infinity' }
        ]
      }
    ];

    let activeCandidate = 1;
    let selectedMode = 'full';

    function renderStaticIcons() {
      document.querySelectorAll('[data-static-icon]').forEach((element) => {
        element.innerHTML = icon(element.dataset.staticIcon);
      });
      document.querySelectorAll('[data-inline-icon]').forEach((element) => {
        element.innerHTML = icon(element.dataset.inlineIcon);
      });
    }

    function renderCandidateList() {
      const list = document.getElementById('candidateList');
      list.innerHTML = candidates.map((candidate, index) => `
        <button class="candidate-button" type="button" role="tab" aria-selected="${index === activeCandidate}" data-candidate="${index}">
          <span class="candidate-index">0${index + 1}</span>
          <span class="candidate-copy"><span class="candidate-name">${candidate.name}</span><span class="candidate-note">${candidate.note}</span></span>
          <span class="candidate-trio">${candidate.icons.map((item) => icon(item.name)).join('')}</span>
        </button>`).join('');

      list.querySelectorAll('[data-candidate]').forEach((button) => {
        button.addEventListener('click', () => {
          activeCandidate = Number(button.dataset.candidate);
          render();
        });
      });
    }

    function renderMenu(candidate) {
      const menu = document.getElementById('modeMenu');
      menu.innerHTML = `
        <div class="menu-head">会话模式</div>
        ${modes.map((mode, index) => `
          <button class="mode-row ${mode.id === selectedMode ? 'is-selected' : ''}" type="button" role="menuitemradio" aria-checked="${mode.id === selectedMode}" data-mode="${mode.id}">
            <span class="mode-row-icon">${icon(candidate.icons[index].name)}</span>
            <span><span class="mode-label">${mode.label}</span><span class="mode-description">${mode.description}</span></span>
          </button>`).join('')}`;

      menu.querySelectorAll('[data-mode]').forEach((button) => {
        button.addEventListener('click', () => {
          selectedMode = button.dataset.mode;
          renderPreview();
        });
      });
    }

    function renderTrigger(candidate) {
      const modeIndex = modes.findIndex((mode) => mode.id === selectedMode);
      const mode = modes[modeIndex];
      document.getElementById('modeTrigger').innerHTML = `${icon(candidate.icons[modeIndex].name)}<span>${mode.label}</span>${icon('chevronUp', 'chevron')}`;
    }

    function renderInspector(candidate) {
      document.getElementById('recommendation').innerHTML = candidate.recommended ? '<span class="recommendation">首选建议</span>' : '';
      document.getElementById('inspectorTitle').textContent = candidate.name;
      document.getElementById('inspectorSummary').textContent = candidate.summary;
      document.getElementById('judgement').textContent = candidate.judgement;
      document.getElementById('iconSpecs').innerHTML = modes.map((mode, index) => `
        <div class="icon-spec">
          <span class="icon-spec-glyph">${icon(candidate.icons[index].name)}</span>
          <strong>${mode.label}</strong>
          <code>${candidate.icons[index].component}</code>
        </div>`).join('');
    }

    function renderPreview() {
      const candidate = candidates[activeCandidate];
      renderMenu(candidate);
      renderTrigger(candidate);
      renderInspector(candidate);
    }

    function render() {
      const candidate = candidates[activeCandidate];
      renderCandidateList();
      document.getElementById('stageKicker').textContent = candidate.recommended ? '推荐候选' : `候选 0${activeCandidate + 1}`;
      document.getElementById('stageTitle').textContent = candidate.name;
      renderPreview();
    }

    function updateThemeButton() {
      const dark = document.documentElement.dataset.scheme === 'dark';
      document.getElementById('themeButton').innerHTML = `${icon(dark ? 'sun' : 'moon')}<span>${dark ? '浅色预览' : '深色预览'}</span>`;
    }

    document.getElementById('themeButton').addEventListener('click', () => {
      document.documentElement.dataset.scheme = document.documentElement.dataset.scheme === 'dark' ? 'light' : 'dark';
      updateThemeButton();
    });

    window.addEventListener('keydown', (event) => {
      if (/^[1-5]$/.test(event.key)) {
        activeCandidate = Number(event.key) - 1;
        render();
      }
      if (event.key.toLowerCase() === 'l') document.getElementById('themeButton').click();
    });

    renderStaticIcons();
    updateThemeButton();
    render();
  </script>
</body>
</html>
